# Render Blueprint — Community Recycling Reward System
# Deploy: Dashboard → New → Blueprint → connect this repo

services:
  - type: web
    name: ecorewards
    rootDir: .
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:render
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: SKIP_DATABASE_SEED
        value: "true"
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: NEXTAUTH_URL
        value: https://yayay-8tut.onrender.com
      # Set DATABASE_URL to a reachable public MySQL URL from Railway or another host that Render can access.
      # Do NOT use mysql.railway.internal from Render; it is not reachable from Render services.
      # Set in Render Dashboard → Environment (not committed):
      # GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET — Gmail / Google sign-in
      # GEMINI_API_KEY — AI assistant & waste classification
      # GEMINI_CHAT_MODEL=gemini-2.5-flash-lite (optional)
      # GEMINI_VISION_MODEL=gemini-2.5-flash (optional)
