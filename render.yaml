# Render Blueprint — Community Recycling Reward System
# Deploy: Dashboard → New → Blueprint → connect this repo

services:
  - type: web
    name: ecorewards
    rootDir: .
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:render
    startCommand: npm run db:setup && npm run start:next
    healthCheckPath: /
    envVars:
      - key: SKIP_DATABASE_SEED
        value: "true"
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: SMS_SERVICE_URL
        value: http://ecorewards-sms:10000
      - key: SMS_SERVICE_TOKEN
        generateValue: true
      - key: SMS_API_KEY
        sync: false
      - key: TURN_SERVER_URL
        sync: false
      - key: TURN_SHARED_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      # Set NEXTAUTH_URL in Render Dashboard to your public service URL, e.g. https://your-app.onrender.com.
      # Do not hardcode a specific hostname in the repo; Render assigns the final domain at deploy time.
      # Set DATABASE_URL to the pooled PostgreSQL URL and DIRECT_URL to the direct/session URL.
      # Set in Render Dashboard → Environment (not committed):
      # GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET — Gmail / Google sign-in
      # GEMINI_API_KEY — AI assistant & waste classification
      # GEMINI_CHAT_MODEL=gemini-2.5-flash-lite (optional)
      # GEMINI_VISION_MODEL=gemini-2.5-flash (optional)

  - type: web
    name: ecorewards-sms
    rootDir: sms-service
    runtime: ruby
    plan: free
    buildCommand: bundle install
    startCommand: bundle exec ruby app.rb
    healthCheckPath: /health
    ipAllowList: []
    envVars:
      - key: PORT
        value: "10000"
      - key: SMS_SERVICE_TOKEN
        fromService:
          type: web
          name: ecorewards
          envVarKey: SMS_SERVICE_TOKEN
      - key: SMS_API_KEY
        fromService:
          type: web
          name: ecorewards
          envVarKey: SMS_API_KEY
      - key: SEMAPHORE_API_KEY
        sync: false
      - key: SMS_SENDER_NAME
        value: EcoRewards
